name: decomp.dev progress report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/decompdev-report.yml"
      - "docs/decompdev/progress.json"
      - "tools/decompdev_report.py"
      - "tools/test_decompdev_report.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Build the scoped objdiff report (no game files)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the report generator
        run: python -m unittest tools.test_decompdev_report -v

      - name: Generate the decomp.dev report from audited metrics
        run: python tools/decompdev_report.py --in docs/decompdev/progress.json --out build/report.json

      - name: Upload the report for decomp.dev
        uses: actions/upload-artifact@v7
        with:
          name: SLUS_213.76_report
          path: build/report.json
          if-no-files-found: error
